# cargo-deny 정책 — PRD 8.2절. 업스트림(rhwp)의 의존성 그래프에 대해 실행한다:
#   cargo deny --locked --manifest-path third_party/rhwp/Cargo.toml check --config licensing/deny.toml
# 허용: MIT, Apache-2.0, BSD-2/3, ISC, Zlib, Unicode 계열, (폰트 한정) OFL-1.1(크레이트에는 해당 없음)
# 검토 필요: MPL-2.0, LGPL   금지: GPL, AGPL, SSPL, 라이선스 불명·독점
[graph]
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.9
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "BSD-1-Clause", "ISC", "Zlib", "0BSD",
    "Unicode-3.0", "Unicode-DFS-2016", "Unlicense", "CC0-1.0", "MIT-0", "BSL-1.0",
]
# GPL/AGPL/SSPL/LGPL은 allow에 없으므로 자동으로 거부된다.
# OR 표현식(예: r-efi의 `MIT OR Apache-2.0 OR LGPL-2.1-or-later`)은 허용 항목 하나만 만족하면 통과한다.

[bans]
multiple-versions = "allow"
# 업스트림 rhwp 매니페스트가 워크스페이스 내부 크레이트를 버전 없는 path 의존성으로 선언해 deny가 걸린다.
# 업스트림 파일은 수정하지 않으므로 허용한다. 우리 자체 크레이트에는 별도 정책을 적용한다.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
