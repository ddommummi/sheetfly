# cargo-about 설정 — PRD 8.2절 허용 목록.
# 허용: MIT, Apache-2.0, BSD-2/3, ISC, Zlib, Unicode 계열, (폰트 한정) OFL-1.1
# 검토 필요: MPL-2.0, LGPL / 금지: GPL, AGPL, SSPL, 라이선스 불명·독점
# 아래 목록은 허용 목록 + 업스트림 의존성이 OR 선택지로 포함하는 permissive 항목이다.
# (예: r-efi는 `MIT OR Apache-2.0 OR LGPL-2.1-or-later` — LGPL을 선택하지 않고 MIT를 선택한다.)
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "BSL-1.0",
    "BSD-1-Clause",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
workarounds = []
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-linux-android", "aarch64-apple-ios"]
